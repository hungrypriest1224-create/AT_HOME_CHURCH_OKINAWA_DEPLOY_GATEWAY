name: Verify AHC deploy gateway code

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check gateway JavaScript syntax
        run: |
          node --check gateway/drive-snapshot.mjs
          node --check gateway/verify-production.mjs

      - name: Validate fixed deployment configuration
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const config = JSON.parse(fs.readFileSync("gateway/config.json", "utf8"));
          const expected = {
            firebaseProjectId: "at-home-church-okinawa",
            productionUrl: "https://at-home-church-okinawa.web.app",
            publicFolderName: "public"
          };
          for (const [key, value] of Object.entries(expected)) {
            if (config[key] !== value) {
              throw new Error(`Unexpected ${key}: ${config[key]}`);
            }
          }
          if (!config.driveRootFolderId) throw new Error("driveRootFolderId is missing");
          NODE

      - name: Ensure production workflow remains manual-only
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const text = fs.readFileSync(".github/workflows/deploy-production.yml", "utf8");
          if (!/^\s{2}workflow_dispatch:/m.test(text)) {
            throw new Error("Production workflow must use workflow_dispatch");
          }
          for (const forbidden of ["push:", "pull_request:", "pull_request_target:", "schedule:", "issues:", "issue_comment:"]) {
            const re = new RegExp("^\\s{2}" + forbidden.replace(/[.*+?^$()|[\\]\\]/g, "\\$&"), "m");
            if (re.test(text)) {
              throw new Error(`Forbidden production trigger found: ${forbidden}`);
            }
          }
          if (!text.includes("cancel-in-progress: false")) {
            throw new Error("Production concurrency must not cancel an in-progress deploy");
          }
          if (!text.includes('--only hosting --project "at-home-church-okinawa"')) {
            throw new Error("Hosting-only pinned Firebase deploy command is missing");
          }
          NODE
